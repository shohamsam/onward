<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Onward</title>
    <!-- 2026-11-25 link preview (WhatsApp, iMessage, LinkedIn, Slack) for the friends beta. og:image must be a full
         address. The picture is public/og-image.png (1200x630, app icon + name + line). Copy is provisional. -->
    <meta name="description" content="Your job applications, on your phone. Private, no account." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Onward" />
    <meta property="og:title" content="Onward" />
    <meta property="og:description" content="Your job applications, on your phone. Private, no account." />
    <meta property="og:url" content="https://shohamsam.github.io/onward/" />
    <meta property="og:image" content="https://shohamsam.github.io/onward/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Onward app icon next to the words: Onward. Your job applications, on your phone." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 2026-10-20 hosting: a private tool on a public address. Ask search engines to stay away (the
         robots.txt in public/ says the same; neither is a lock, the address is just not advertised). -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Add to Home Screen opens it full-screen (phase B2a). theme-color and the manifest's colors are
         the app background, --color-bg-app = --gray-50 (#f5f7fa); a meta tag cannot read a CSS
         variable, so the value is repeated here. status-bar-style "default" (not black-translucent):
         the status bar stays light with dark text over the app's light background. -->
    <meta name="theme-color" content="#f5f7fa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Onward" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index-CtyL9Mri.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DvSDrBWt.css">
  </head>

</html>
